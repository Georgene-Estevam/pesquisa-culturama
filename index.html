<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <img src="" alt="">
    </header>

    <section>
        <form action="" method="post">
            <fieldset>
                <legend>Dados pessoais</legend>

                    <!--Dados pessoais-->
                    <label for="name">Digite seu nome:*</label>
                    <input type="text" name="userName" id="name" required><br>
                    <label for="lastName">Digite seu sobrenome:*</label>
                    <input type="text" name="userLastName" id="lastName" required><br>

                    <label for="age">Idade:</label>
                    <input type="number" name="userAge" id="age" min="12" max="100" required><br>
                    <label for="birthDate">Data de nascmento:</label>
                    <input type="date" name="userBirthDate" id="birthDate"><br>

                    <label for="email">Email:*</label>
                    <input type="email" name="userEmail" id="email" required><br>
                    <label for="phoneNumber">Telefone:</label>
                    <input type="tel" name="userPhoneNumber" id="phoneNumber" pattern="[0-9]{11}" placeholder="Ex: 81921443222"><br>

                    <label for="image">Upload de foto</label>
                    <input type="file" name="userImage" id="image"><br>
            </fieldset>

            <fieldset>
                <legend>Perfil do usuário</legend>

                <p>Gênero:</p>
                <input type="radio" name="userGender" id="fem" value="Feminino">
                <label for="fem">Feminino</label>

                <input type="radio" name="userGender" id="masc" value="Masculino">
                <label for="masc">Masculino</label>

                <input type="radio" name="userGender" id="notInformed" value="naoInformado">
                <label for="notInformed">Prefiro não informar</label>
                <br>

                <label for="maritalStatus">Estado civil:</label>
                <select name="userMaritalStatus" id="maritalStatus">
                    <option value="naoInformado">Selecione...</option>
                    <option value="solteiro">Solteiro</option>
                    <option value="casado">Casado</option>
                    <option value="divorciado">Divorciado</option>
                    <option value="casado">União estável</option>
                </select>
                <br>

                <label for="state">Selecione seu estado:</label>
                <select name="userState" id="state" required>
                    <option value="acre">Acre</option>
                    <option value="acre">Alagoas</option>
                    <option value="amapa">Amapá</option>
                    <option value="amazonas">Amazonas</option>
                    <option value="bahia">Bahia</option>
                    <option value="ceara">Ceará</option>
                    <option value="distrito-federal">Distrito Federal</option>
                    <option value="espirito-santo">Espirito Santo</option>
                    <option value="goias">Goiás</option>
                    <option value="maranhao">Maranhão</option>
                    <option value="mato-grosso-do-sul">Mato Grosso do Sul</option>
                    <option value="mato-grosso">Mato Grosso</option>
                    <option value="minas-gerais">Minas Gerais</option>
                    <option value="para">Pará</option>
                    <option value="paraiba">Paraíba</option>
                    <option value="parana">Paraná</option>
                    <option value="pernambuco">Pernambuco</option>
                    <option value="piaui">Piauí</option>
                    <option value="rio-de Janeiro">Rio de Janeiro</option>
                    <option value="rio-grande-do-norte">Rio Grande do Norte</option>
                    <option value="rio-grande-do-sul">Rio Grande do Sul</option>
                    <option value="rondonia">Rondônia</option>
                    <option value="roraima">Roraima</option>
                    <option value="santa-catarina">Santa Catarina</option>
                    <option value="sao-paulo">São Paulo</option>
                    <option value="sergipe">Sergipe</option>
                    <option value="tocantins">Tocantins</option>
                </select>
                <br>

                <label for="city">Cidade:</label>
                <input type="text" name="userCity" id="city">
            </fieldset>

            <fieldset>
                <legend>Hábitos:</legend>
                <p>Redes sociais:</p>

                <input type="checkbox" name="social" id="facebook" value="facebook">
                <label for="facebook">Facebook</label>
                <br>
                <input type="checkbox" name="social" id="instagram" value="instagram">
                <label for="instagram">Instagram</label>
                <br>
                <input type="checkbox" name="social" id="linkedin" value="linkedin">
                <label for="linkedin">Linkedin</label>
                <br>
            </fieldset>

            <button type="submit">Enviar</button>
        </form>
    </section>
</body>
</html>
